name: Build_OpenWRT 

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:
    inputs:
      os:
        description: "Select os"
        required: false
        default: "ubuntu-22.04"
        type: choice
        options:
          - ubuntu-22.04 
          - ubuntu-24.04 
          - ubuntu-26.04 
      platform:
        description: "Select platform"
        required: false
        default: "x86"
        type: choice
        options:
          - x86
          - armsr
          - ramips
      branch:
        description: "Select branch"
        required: false
        default: "master"
        type: choice
        options:
          - master 
          - openwrt-23.05 
          - openwrt-24.10 
          - openwrt-25.12 
      version:
        description: "Select version"
        required: false
        default: "v23.05.7"
        type: choice
        options:
          - v23.05.7 
          - v24.10.6 
          - v25.12.2
      thread:
        description: "Select thread"
        required: false
        default: "1"
        type: choice
        options:
          - 1 
          - 5 
      object:
        description: "Select object"
        required: false
        default: "all"
        type: choice
        options:
          - all 
          - package

env:
  OS: ${{ inputs.os }}  
  REPO_URL: https://github.com/immortalwrt/immortalwrt 
  REPO_BRANCH: ${{ inputs.branch }}  
  VERSION: ${{ inputs.version }}
  PLATFORM: ${{ inputs.platform }}  
  THREAD: ${{ inputs.thread }}
  OBJECT: ${{ inputs.object }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Initialization environment ${{ inputs.os }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set +e
        sudo -E apt-get update
        
        case $OS in
          ubuntu-22.04)
            sudo -E apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget
            ;;
          ubuntu-24.04)
            sudo -E apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
            ;;
          ubuntu-26.04)
            sudo -E apt-get -y install bzip2 g++ gawk gcc git glibc-source libncurses-dev make unzip
            ;;
          *)
            ;;
        esac

    - name: Clone source code
      run: |
        git clone -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        if [[ $REPO_BRANCH == "master" ]]; then
          git checkout $VERSION 
        fi
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    #- name: Import external feeds - passwall
    #  working-directory: ./openwrt
    #  run: |
    #    git clone https://github.com/xiaorouji/openwrt-passwall.git package/lienol
    #    git clone "your_github_link" package/"your_folder_name"      

    - name: Import external feeds - luci-app-amlogic 
      working-directory: ./openwrt
      run: |
        if [[ $PLATFORM == "armsr" ]]; then
          git clone https://github.com/ophub/luci-app-amlogic.git package/luci-app-amlogic
        fi

    - name: Configuration Customization - Build ${{ inputs.platform }}_${{ inputs.version }}
      run: |
        if [[ $REPO_BRANCH == "master" ]]; then
          CONFIG_FILE=${PLATFORM}_v${VERSION:1:5}.config
        else
          CONFIG_FILE=${PLATFORM}_v${REPO_BRANCH:8}.config
        fi
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig
        
    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        if [[ $OBJECT == "all" ]]; then
          echo -e "$THREAD thread build."
          make -j$THREAD V=s
        else
          echo -e "build package."
          chmod +x ./customize2.sh && ./customize2.sh
        fi

    - name: Generate files 
      working-directory: ./openwrt
      run: |
        mkdir output

        case $PLATFORM in
          x86)
            FILES="*combined-efi*"
            ;;
          armsr)
            FILES="*rootfs*"
            ;;
          ramips)
            FILES="*sysupgrade*"
            ;;
          *)
            ;;
        esac

        cp bin/targets/*/*/$FILES output

    - name : Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt_${{ inputs.platform }}_${{ inputs.version }}
        path: openwrt/output 
