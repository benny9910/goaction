name: Build_OpenWRT 

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:
    inputs:
      platform:
        description: "Select platform"
        required: false
        default: "x86"
        type: choice
        options:
          - x86
          - armsr
          - ramips
      version:
        description: "Select version"
        required: false
        default: "v23.05.7"
        type: choice
        options:
          - v23.05.7 
          - v24.10.6 
          - v25.12.2 

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt 
  REPO_BRANCH: master
  VERSION: ${{ inputs.version }}
  PLATFORM: ${{ inputs.platform }}  
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set +e
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        
    - name: Clone source code
      run: |
        git clone -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        git checkout $VERSION 
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    #- name: Import external feeds - passwall
    #  working-directory: ./openwrt
    #  run: |
    #    git clone https://github.com/xiaorouji/openwrt-passwall.git package/lienol
    #    git clone "your_github_link" package/"your_folder_name"      

    - name: Import external feeds - luci-app-amlogic 
      working-directory: ./openwrt
      run: |
        if [[ $PLATFORM == "armsr" ]]; then
          git clone https://github.com/ophub/luci-app-amlogic.git package/luci-app-amlogic
        fi

    - name: Configuration Customization - Build ${{ inputs.platform }}_${{ inputs.version }}
      env:
        CONFIG_FILE: ${{ inputs.platform }}_${{ inputs.version }}.config 
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig
        
    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s

    - name: Generate files 
      working-directory: ./openwrt
      run: |
        mkdir output

        case $PLATFORM in
          x86)
            FILES="*combined-efi*"
            ;;
          armsr)
            FILES="*rootfs*"
            ;;
          ramips)
            FILES="*sysupgrade*"
            ;;
          *)
            ;;
        esac

        cp bin/targets/*/*/$FILES output

    - name : Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt_${{ inputs.platform }}_${{ inputs.version }}
        path: openwrt/output 
